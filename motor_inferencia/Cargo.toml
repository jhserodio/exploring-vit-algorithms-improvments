[package]
name = "motor_inferencia"
version = "0.2.0"
edition = "2024"

# FP32 numerical reference is CPU-only and implemented in standalone Rust.
# GPU kernels are native CUDA Rust and live in ../cuda-kernels (CUDA 13.3+).
[dependencies]
anyhow = "1.0.86"
image = "0.24.9"
ndarray = "0.16.1"
safetensors = "0.5.3"
libm = "0.2.11"

x-research-base: &research-base
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    # Shared :z labels for Fedora SELinux; relabels host files.
    - .:/workspace:z
    - ${DATA_DIR:-./data}:/data:ro,z
    - ${MODEL_DIR:-./models}:/models:ro,z

services:
  vit-cpu:
    <<: *research-base
    working_dir: /workspace/motor_inferencia
    command: ["cargo", "test"]

  vit-gpu:
    <<: *research-base
    profiles: ["gpu"]
    working_dir: /workspace/cuda-kernels
    environment:
      CUDA_COMPUTE_CAP: "120"
      CUDA_TOOLKIT_PATH: "/usr/local/cuda"
    # Native CUDA Rust operation probe only, not full model inference.
    command: ["cargo", "run", "--release"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

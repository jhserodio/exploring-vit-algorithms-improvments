x-research-base: &research-base
  volumes:
    # Shared SELinux labels for Fedora. Use dedicated data directories:
    # :z may relabel host files, even on read-only mounts.
    - .:/workspace:z
    - ${DATA_DIR:-./data}:/data:ro,z
    - ${MODEL_DIR:-./models}:/models:ro,z

services:
  vit-cpu:
    <<: *research-base
    build:
      context: .
      dockerfile: Dockerfile.cpu
    working_dir: /workspace/motor_inferencia
    command: ["cargo", "test", "--locked"]

  vit-gpu:
    <<: *research-base
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/cuda-kernels
    environment:
      CUDA_COMPUTE_CAP: "120"
      CUDA_TOOLKIT_PATH: "/usr/local/cuda"
    # GPU-only operation probes, not full DINOv2 inference.
    command: ["cargo", "run", "--release", "--", "all"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

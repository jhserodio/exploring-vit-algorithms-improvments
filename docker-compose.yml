x-research-base: &research-base
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace/motor_inferencia
  volumes:
    # Shared SELinux labels permit both services to mount the same paths on Fedora.
    # :z relabels host files: use dedicated paths. See PHASE0.md.
    - .:/workspace:z
    - ${DATA_DIR:-./data}:/data:ro,z
    - ${MODEL_DIR:-./models}:/models:ro,z

services:
  vit-cpu:
    <<: *research-base
    # CPU-only test execution without claiming a GPU device.

  vit-gpu:
    <<: *research-base
    profiles: ["gpu"]
    environment:
      CUDA_COMPUTE_CAP: "120"
    # Explicit CUDA inference, not the Dockerfile's CPU-test default.
    # Expects /models/model.safetensors and /data/example.png.
    command: ["cargo", "run", "--release", "--features", "cuda", "--", "--cuda", "--weights", "/models/model.safetensors", "--image", "/data/example.png"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Ordinary inference needs no SYS_ADMIN. Profile separately if needed.

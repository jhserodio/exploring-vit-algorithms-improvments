x-research-base: &research-base
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace/motor_inferencia
  volumes:
    - .:/workspace
    - ${DATA_DIR:-./data}:/data:ro
    - ${MODEL_DIR:-./models}:/models:ro

services:
  vit-cpu:
    <<: *research-base
    # CPU-only test execution without claiming a GPU device.

  vit-gpu:
    <<: *research-base
    profiles: ["gpu"]
    environment:
      CUDA_COMPUTE_CAP: "120"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Ordinary inference needs no SYS_ADMIN. Profile separately if needed.

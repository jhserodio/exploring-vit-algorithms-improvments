services:
  vit-engine:
    build:
      context: .
      dockerfile: Dockerfile

    profiles: ["benchmark"]

    working_dir: /workspace/motor_inferencia

    volumes:
      - .:/workspace
      - ${DATA_DIR}:/data:ro
      - ${HF_CACHE_DIR}:/root/.cache/huggingface/hub:ro

    environment:
      RAYON_NUM_THREADS: "4"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest

    profiles: ["assistant"]

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"

    volumes:
      - ollama_models:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_models:

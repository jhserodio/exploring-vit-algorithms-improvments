name: Rust CPU correctness

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor_inferencia
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: CPU tests
        run: cargo test --no-default-features
      - name: CLI smoke
        run: cargo run --no-default-features -- --help
      - name: Reference parity script help (no model weights required)
        run: python3 ../scripts/compare_dinov2_reference.py --help
      - name: Clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

name: Rust CPU correctness (Candle-free)
on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor_inferencia
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and export exact rustfmt sources (temporary migration helper)
        run: |
          cargo fmt --all
          for file in src/dinov2.rs src/lib.rs src/main.rs src/preprocess.rs src/spatial.rs tests/cli.rs; do
            printf 'RUSTFMT_BLOB::%s::' "$file"
            base64 -w0 "$file"
            echo
          done
      - name: CPU reference correctness tests
        run: cargo test
      - name: Emit regenerated Cargo lockfile (temporary migration helper)
        run: |
          printf 'CARGOLOCK_BLOB::'
          base64 -w0 Cargo.lock
          echo
      - name: CLI smoke
        run: cargo run -- --help
      - name: Python reference parity script help (does not load model)
        run: python3 ../scripts/compare_dinov2_reference.py --help
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

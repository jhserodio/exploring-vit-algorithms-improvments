name: Rust CPU reference and spatial checks
on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor_inferencia
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Block stale runtime-framework names
        run: python3 ../scripts/check_legacy_runtime_refs.py
      - name: Sandbox offline preflight and shell checks
        run: |
          python3 ../scripts/sandbox_preflight.py --json
          python3 -m unittest discover -s ../scripts -p 'test_sandbox_preflight.py' -v
          bash -n ../scripts/*.sh
      - name: Validate CPU/GPU Compose service configuration
        run: docker compose -f ../docker-compose.yml --profile gpu config --quiet
      - name: Verify CPU container build
        run: docker build --file ../Dockerfile.cpu --tag vit-sandbox-cpu:ci ..
      - name: Format
        run: cargo fmt --all -- --check
      - name: CPU reference correctness tests
        run: cargo test --locked
      - name: CLI smoke
        run: cargo run --locked -- --help
      - name: Python reference parity script help (does not load model)
        run: python3 ../scripts/compare_dinov2_reference.py --help
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

name: Rust CPU correctness (Candle-free)
on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor_inferencia
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: CPU reference correctness tests
        run: cargo test
      - name: CLI smoke
        run: cargo run -- --help
      - name: Python reference parity script help (does not load model)
        run: python3 ../scripts/compare_dinov2_reference.py --help
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
